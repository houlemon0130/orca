name: Build fork release

# Why: builds the user's qodercli-support branch on GitHub and publishes a
# release to houlemon0130/orca, so the local app's update channel (which points
# at this fork) picks up every new build.
#
# Signing: when the CSC_LINK secret (a base64 Developer ID p12) is configured,
# the build runs through the repo's signed adhoc path (ORCA_MAC_ADHOC=1), which
# also notarizes and signs the nested Computer Use helper so macOS TCC grants
# survive updates. Without the secret the build stays unsigned (local-style).
#
# The publish config in config/electron-builder.config.cjs already targets
# owner houlemon0130 / repo orca (the default, non-hourly path), so plain
# electron-builder --publish with the default GITHUB_TOKEN publishes here.
#
# Why a release is pre-created: electron-builder runs one packager per target
# arch (x64 + arm64) in parallel, and each races to create the GitHub release;
# the loser gets 422 "Published releases must have a valid tag". Pre-creating
# the release makes both packagers find it and just upload into it.

on:
  push:
    branches: [qodercli-support]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fork-release
  cancel-in-progress: true

jobs:
  build-mac:
    if: github.repository == 'houlemon0130/orca'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: qodercli-support
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Compute build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Same shape as a local build: <package version>.local.<timestamp>.<sha12>
          base="$(node -p "require('./package.json').version")"
          sha="$(git rev-parse --short=12 HEAD)"
          echo "version=${base}.local.$(date +%s).${sha}" >>"$GITHUB_OUTPUT"
          echo "commit=${sha}" >>"$GITHUB_OUTPUT"

      - name: Build app
        run: pnpm build:release

      # Pre-create so the two arch packagers don't race to create it (see header).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Automated build of qodercli-support @ ${{ steps.version.outputs.commit }}" \
            || echo "::warning::release already exists; electron-builder will reuse it"

      - name: Publish macOS artifacts
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ steps.version.outputs.commit }}"
          if [ -n "${CSC_LINK:-}" ]; then
            echo "Signing with Developer ID certificate (signed + notarized build)"
            ORCA_MAC_ADHOC=1 \
            ORCA_ADHOC_BUILD_VERSION="$VERSION" \
            ORCA_BUILD_COMMIT="$COMMIT" \
              pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish always
          else
            echo "No signing certificate configured; building unsigned (local-style)"
            ORCA_LOCAL_BUILD_VERSION="$VERSION" \
            ORCA_BUILD_COMMIT="$COMMIT" \
              pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish always
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
