name: Sync upstream main

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync main from upstream
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin main

      - name: Sync qodercli-support with main
        run: |
          git fetch origin qodercli-support
          git checkout qodercli-support
          git merge --no-edit origin/main
          git push origin qodercli-support
